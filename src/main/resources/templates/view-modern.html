<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>ESUP File Manager</title>

    <!-- CSS Bootstrap 5 -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}" />
    <link rel="stylesheet" th:href="@{/webjars/flag-icons/css/flag-icons.min.css}" />

    <!-- CSS Custom -->
    <link rel="stylesheet" th:href="@{/css/esup-stock.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/css/google-open-sans.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/css/file-tree.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/css/esup-responsive.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/css/details-modern.css}" type="text/css">

</head>
<body class="d-flex flex-column min-vh-100">
    <!-- WCAG 2.4.1 skip link -->
    <a href="#rightPanel" class="visually-hidden-focusable" th:text="#{skip.to.main}">Skip to main content</a>

    <div id="esup-app-config" hidden
         data-html-file-tree-url="./htmlFileTree"
         data-upload-file-url="./uploadFile"
         data-prepare-copy-files-url="./prepareCopyFiles"
         data-prepare-cut-files-url="./prepareCutFiles"
         data-past-files-url="./pastFiles"
         data-file-children-url="./fileChildren"
         data-details-area-url="./detailsArea"
         data-rename-file-url="./renameFile"
         data-download-file-url="./downloadFile"
         data-download-zip-url="./downloadZip"
         data-remove-files-url="./removeFiles"
         th:attr="data-use-double-click=${useDoubleClick},
                  data-default-path=${defaultPath},
                  data-i18n-upload-file-success=#{info.uploadFileSuccess},
                  data-i18n-upload-file-failed=#{info.uploadFileFailed},
                  data-i18n-upload-files-success=#{info.uploadFilesSuccess},
                  data-i18n-upload-files-partial=#{info.uploadFilesPartial},
                  data-i18n-uploading-progress=#{info.uploadingProgress},
                  data-i18n-upload-progress=#{info.uploadProgress},
                  data-i18n-upload-errors=#{info.uploadErrors},
                  data-i18n-copy-ok=#{ajax.copy.ok},
                  data-i18n-copy-failed=#{error.copyFailed},
                  data-i18n-items-copied=#{info.itemsCopied},
                  data-i18n-cut-ok=#{ajax.cut.ok},
                  data-i18n-cut-failed=#{error.cutFailed},
                  data-i18n-items-cut=#{info.itemsCut},
                  data-i18n-paste-ok=#{ajax.paste.ok},
                  data-i18n-paste-failed=#{ajax.paste.failed},
                  data-i18n-clipboard-empty=#{error.clipboardEmpty},
                  data-i18n-remove-ok=#{ajax.remove.ok},
                  data-i18n-remove-failed=#{ajax.remove.failed},
                  data-i18n-delete-confirm-title=#{delete.confirm.title},
                  data-i18n-delete-confirm-message=#{delete.confirm.message},
                  data-i18n-delete-confirm-ok=#{delete.confirm.ok},
                  data-i18n-delete-confirm-cancel=#{delete.confirm.cancel},
                  data-i18n-delete-button=#{toolbar.delete.button},
                  data-i18n-rename-title=#{dialog.rename.title},
                  data-i18n-rename-button=#{dialog.rename.button},
                  data-i18n-rename-success=#{ajax.rename.success},
                  data-i18n-rename-failed=#{ajax.rename.failed},
                  data-i18n-create-success=#{ajax.fileOrFolderCreate.success},
                  data-i18n-create-failed=#{ajax.fileOrFolderCreate.failed},
                  data-i18n-create-button=#{toolbar.create.button},
                  data-i18n-new-folder-placeholder=#{dialog.newFolder.placeholder},
                  data-i18n-refresh=#{toolbar.refresh},
                  data-i18n-new-folder=#{toolbar.create},
                  data-i18n-paste=#{toolbar.paste},
                  data-i18n-download=#{toolbar.download},
                  data-i18n-copy=#{toolbar.copy},
                  data-i18n-cut=#{toolbar.cut},
                  data-i18n-rename=#{toolbar.rename},
                  data-i18n-delete=#{toolbar.delete},
                  data-i18n-auth-ok=#{auth.ok},
                  data-i18n-auth-bad=#{auth.bad},
                  data-i18n-auth-missing-credentials=#{auth.missingCredentials},
                  data-i18n-auth-error=#{auth.error},
                  data-i18n-no-file-selected=#{error.noFileSelected},
                  data-i18n-directory-loading-error=#{error.directoryLoading},
                  data-i18n-details-loading=#{details.loading},
                  data-i18n-details-loading-error=#{details.loadingError},
                  data-i18n-details-retry=#{details.retry},
                  data-i18n-refresh-failed=#{error.refreshFailed},
                  data-i18n-sort-failed=#{error.sortFailed},
                  data-i18n-select-one-item=#{error.selectOneItem},
                  data-i18n-cannot-find-file=#{error.cannotFindFile},
                  data-i18n-cannot-retrieve-file-name=#{error.cannotRetrieveFileName},
                  data-i18n-enter-folder-name=#{error.enterFolderName},
                  data-i18n-enter-new-name=#{error.enterNewName},
                  data-i18n-view-refreshed=#{info.viewRefreshed},
                  data-i18n-name-unchanged=#{info.nameUnchanged},
                  data-i18n-upload-conflict-title=#{dialog.upload.conflict.title},
                  data-i18n-upload-conflict-message=#{dialog.upload.conflict.message},
                  data-i18n-upload-conflict-overwrite=#{dialog.upload.conflict.overwrite},
                  data-i18n-upload-conflict-cancel=#{dialog.upload.conflict.cancel}">
    </div>

    <!-- JS - Bootstrap first -->
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}"></script>

    <!-- S3 pre-signed URLs -->
    <script type="text/javascript" th:src="@{/js/esup-presigned-urls.js}"></script>

    <!-- Mobile and Responsive support -->
    <script type="text/javascript" th:src="@{/js/esup-mobile-support.js}"></script>

    <!-- Panel Resizer - Modern resize handling -->
    <script type="text/javascript" th:src="@{/js/panel-resizer.js}"></script>

    <!-- Details Manager - Modern details block management -->
    <script type="text/javascript" th:src="@{/js/details-manager.js}"></script>

    <!-- Application configuration exposed through data-* attributes -->
    <script type="text/javascript" th:src="@{/js/esup-app-config.js}"></script>

    <!-- ES6 Modules - Modern application -->
    <script type="module" th:src="@{/js/esup-stock-modern.js}"></script>

    <!-- Responsive body content -->
    <div th:replace="~{body-responsive :: body}"></div>
</body>
</html>
