<!-- src/main/resources/templates/fileTree.html -->
<nav xmlns:th="http://www.thymeleaf.org" class="breadcrumbs" th:attr="aria-label=#{aria.breadcrumb}">
    <div class="d-inline" th:each="parent, itemStat : ${parentsEncPathes}">
        <th:block th:if="${itemStat.last}">
            <img th:src="${resource.icon}" alt="" aria-hidden="true" />
            <span id="bigdirectory" th:rel="${resource.encPath}" th:text="${resource.title}"></span>
        </th:block>
        <th:block th:unless="${itemStat.last}">
            <a class="fileTreeRefCrumbs" href="#" th:rel="${parent.key}">
                <img th:src="${parent.value[1]}" alt="" aria-hidden="true" />
                <span th:text="${parent.value[0]}"></span>
            </a>
        </th:block>
    </div>
</nav>

<div id="jqueryFileTree">
    <form th:object="${form}" method="post" id="filesForm">
        <table role="table">
            <caption class="visually-hidden" th:text="#{aria.files.table}">File listing</caption>
            <thead role="rowgroup">
            <tr role="row">
                <th role="columnheader" th:attr="aria-sort=${sortField == 'titleAsc' ? 'ascending' : (sortField == 'titleDesc' ? 'descending' : 'none')}">
                    <a class="sortTable"
                       th:rel="${sortField == 'titleAsc' ? 'titleDesc' : 'titleAsc'}"
                       href="#"
                       th:text="#{browserArea.header.filename}"></a>
                </th>
                <th role="columnheader" th:attr="aria-sort=${sortField == 'sizeAsc' ? 'ascending' : (sortField == 'sizeDesc' ? 'descending' : 'none')}">
                    <a class="sortTable"
                       th:rel="${sortField == 'sizeAsc' ? 'sizeDesc' : 'sizeAsc'}"
                       href="#"
                       th:text="#{browserArea.header.size}"></a>
                </th>
                <th role="columnheader" th:text="#{browserArea.header.type}"></th>
                <th role="columnheader" th:attr="aria-sort=${sortField == 'lastModifiedAsc' ? 'ascending' : (sortField == 'lastModifiedDesc' ? 'descending' : 'none')}">
                    <a class="sortTable"
                       th:rel="${sortField == 'lastModifiedAsc' ? 'lastModifiedDesc' : 'lastModifiedAsc'}"
                       href="#"
                       th:text="#{browserArea.header.modified}"></a>
                </th>
            </tr>
            </thead>
            <tbody id="jqueryFileTreeBody" role="rowgroup">
            <tr role="row" th:each="file : ${files}"
                th:if="${file.type == 'folder'}"
                class="selectable"
                th:classappend="|${file.readable ? 'esup-stock-read' : ''} ${file.writeable ? 'esup-stock-write' : ''} ${file.hidden ? 'esup-stock-hidden' : ''}|">
                <td role="cell" class="checkbox">
                    <div class="file-entry">
                        <input type="checkbox" class="browsercheck" th:value="${file.encPath}" name="dirs"
                               th:attr="aria-label=${file.title}"/>
                        <a class="fileTreeRef" href="#" th:title="${file.title}" th:rel="${file.encPath}" th:parent="${file.encParentPath}">
                            <img th:src="${file.icon}" alt="" aria-hidden="true" />
                            <span th:text="${file.title}"></span>
                        </a>
                    </div>
                </td>
                <td role="cell">-</td>
                <td role="cell" th:text="#{browserarea.directory}"></td>
                <td role="cell" th:text="${#dates.format(file.lastModifiedTime, datePattern)}"></td>
            </tr>
            <tr role="row" th:each="file : ${files}"
                th:if="${file.type == 'link'}"
                class="selectable"
                th:classappend="|${file.readable ? 'esup-stock-read' : ''} ${file.writeable ? 'esup-stock-write' : ''} ${file.hidden ? 'esup-stock-hidden' : ''}|">
                <td role="cell" class="checkbox">
                    <div class="file-entry">
                        <a class="fileTreeRef" href="#" th:title="${file.title}" th:rel="${file.encPath}">
                            <img th:src="${file.icon}" alt="" aria-hidden="true" />
                            <span th:text="${file.title}"></span>
                        </a>
                    </div>
                </td>
                <td role="cell">-</td>
                <td role="cell" th:text="#{browserarea.link}"></td>
                <td role="cell" th:text="${#dates.format(file.lastModifiedTime, datePattern)}"></td>
            </tr>
            <tr role="row" th:each="file : ${files}" th:if="${file.type == 'drive'}">
                <td role="cell">
                    <div class="file-entry">
                        <img th:src="${file.icon}" alt="" aria-hidden="true" />
                        <a class="fileCatRef" href="#" th:title="${file.title}" th:rel="${file.encPath}" th:text="${file.title}"></a>
                    </div>
                </td>
                <td role="cell"></td>
                <td role="cell"></td>
                <td role="cell"></td>
            </tr>
            <tr role="row" th:each="file : ${files}" th:if="${file.type == 'category'}">
                <td role="cell">
                    <div class="file-entry">
                        <img th:src="${file.icon}" alt="" aria-hidden="true" />
                        <a class="fileCatRef" href="#" th:title="${file.title}" th:rel="${file.encPath}" th:text="${file.title}"></a>
                    </div>
                </td>
                <td role="cell"></td>
                <td role="cell"></td>
                <td role="cell"></td>
            </tr>
            <tr role="row" th:each="file : ${files}" th:if="${file.type != 'folder' and file.type != 'link' and file.type != 'drive' and file.type != 'category'}" class="selectable">
                <td role="cell" class="checkbox">
                    <div class="file-entry">
                        <input type="checkbox" class="browsercheck" th:value="${file.encPath}" name="dirs"
                               th:attr="aria-label=${file.title}"/>
                        <a class="file" href="#" th:title="${file.title}" th:rel="${file.encPath}">
                            <img th:src="${file.icon}" alt="" aria-hidden="true" />
                            <span th:text="${file.title}"></span>
                        </a>
                    </div>
                </td>
                <td role="cell">
                    <span th:text="${file.formattedSize.size}"></span>
                    <span th:text="#{|details.${file.formattedSize.unit}|}"></span>
                </td>
                <td role="cell" th:text="#{browserarea.file}"></td>
                <td role="cell" th:text="${#dates.format(file.lastModifiedTime, datePattern)}"></td>
            </tr>
            </tbody>
        </table>
    </form>
</div>
